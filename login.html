<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar - Minha Fazenda</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#173c2b;min-height:100vh;display:grid;place-items:center}.box{width:min(390px,88vw);background:white;padding:30px;border-radius:18px;box-shadow:0 12px 40px #0002}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.brand img{width:52px;height:52px;border-radius:14px;object-fit:cover}h1{font-size:24px;margin:0}p{color:#68776f}label{display:block;font-weight:700;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd7d0;border-radius:10px;font-size:16px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#145c3b;color:#fff;font-size:16px;font-weight:700}#msg{min-height:20px;color:#a32323;margin-top:12px}</style></head><body>
<div class="box"><div class="brand"><img src="img/logo-fazenda.png" alt=""><div><h1>Minha Fazenda</h1><p style="margin:4px 0 0">Sistema de Gestão</p></div></div><h1>Entrar</h1><p>Use o e-mail e a senha cadastrados no Firebase.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">Entrar</button><div id="msg"></div></form></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyABjx3tuGu-RUCsU54L98uii_O8p5xMEY8",authDomain:"adminfazenda.firebaseapp.com",projectId:"adminfazenda",storageBucket:"adminfazenda.firebasestorage.app",messagingSenderId:"12112211460",appId:"1:12112211460:web:2694671a6e0e9e6d954f51"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();auth.onAuthStateChanged(u=>{if(u)location.replace('index.html')});loginForm.onsubmit=async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='Entrando...';try{await auth.signInWithEmailAndPassword(email.value.trim(),password.value)}catch(err){msg.textContent=err.code==='auth/invalid-credential'?'E-mail ou senha incorretos.':'Não foi possível entrar. Verifique os dados e a internet.';btn.disabled=false;btn.textContent='Entrar'}};
</script></body></html>
